name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR || '~/APOLLO-SMS' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps.pem
          chmod 600 ~/.ssh/vps.pem
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          rsync -az --progress \
            --exclude '.git/' \
            --exclude '.claude/' \
            --exclude '.agents/' \
            --exclude '.vscode/' \
            --exclude 'node_modules/' \
            --exclude 'apollosms/dist/' \
            --exclude 'backend/bin/' \
            --exclude '.env' \
            --exclude '*.env' \
            --exclude '.env.*' \
            -e "ssh -i ~/.ssh/vps.pem" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/"

      - name: Build and restart on VPS
        run: |
          ssh -i ~/.ssh/vps.pem "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_DIR=${APP_DIR} bash ${APP_DIR}/scripts/deploy.sh"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/vps.pem
